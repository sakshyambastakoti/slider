; =============================================================================
; SLIDER V1 — PlatformIO Configuration File
; =============================================================================
; Target Hardware: Classic ESP32 (ESP32-WROOM-32 / DevKit V1)
; Button: Built-in BOOT Button on GPIO 0
; Bluetooth: Wireless Bluetooth HID Keyboard
; =============================================================================

[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino

; Serial Monitor Baud Rate
monitor_speed = 115200

; Compiler Build Flags
; USE_NIMBLE enables the ultra-efficient NimBLE stack, saving ~50% flash and ~100KB RAM
build_flags = 
    -D USE_NIMBLE

; Required Libraries
lib_deps =
    t-vk/ESP32 BLE Keyboard@^0.3.2
    h2zero/NimBLE-Arduino@^1.4.1
